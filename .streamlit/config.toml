[theme]
primaryColor = "#4F46E5"
backgroundColor = "#F0F4FF"
secondaryBackgroundColor = "#ffffff"
textColor = "#1E293B"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
